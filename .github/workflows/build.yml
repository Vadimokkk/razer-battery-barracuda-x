name: Build Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe and zip
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RazerBattery-Windows
          path: |
            dist/RazerBattery-Windows.zip
            dist/RazerBattery-*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/RazerBattery-$($env:GITHUB_REF_NAME.Substring(1)).exe#RazerBattery.exe" dist/RazerBattery-Windows.zip --title "Razer Battery $env:GITHUB_REF_NAME" --generate-notes
